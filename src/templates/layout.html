<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>{% block title %}Course Explainer{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="{{ url_for('index') }}" style="text-decoration:none;"><h1 class="site-title">Course Explainer</h1></a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="mainNav">
        <span></span><span></span><span></span>
      </button>
    </div>
    <ul class="main-nav" id="mainNav">
      <li><a href="{{ url_for('index') }}"{% if active_page == 'home' %} class="active"{% endif %}>Home</a></li>
      <li><a href="{{ url_for('course', course_id=1) }}"{% if active_page == 'course' %} class="active"{% endif %}>Course Details</a></li>
      <li><a href="{{ url_for('contact') }}"{% if active_page == 'contact' %} class="active"{% endif %}>Contact</a></li>
    </ul>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">© 2026 Course Explainer App</div>
  </footer>

  <script>
    (function () {
      var btn = document.getElementById('navToggle');
      var nav = document.getElementById('mainNav');
      if (!btn || !nav) return;
      btn.addEventListener('click', function () {
        var open = nav.classList.toggle('open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    })();
  </script>
</body>
</html>
